<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Flow Guard Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">ANALOG FLOW GUARD</p>
        <h1>유량 모니터</h1>
        <p id="device-label" class="subtitle">장치를 불러오는 중</p>
      </div>
      <div id="connection-badge" class="badge badge-waiting">설정 확인 중</div>
    </header>
    <section class="summary-grid" aria-label="현재 상태">
      <article class="card current-card"><p class="label">현재 유량</p><div class="current-reading"><strong id="current-flow">--</strong><span>L/min</span></div><p id="reading-status" class="reading-status">데이터를 기다리고 있습니다.</p></article>
      <article class="card"><p class="label">저유량 기준</p><strong id="threshold-value" class="secondary-value">-- L/min</strong></article>
      <article class="card"><p class="label">마지막 측정</p><strong id="last-measured" class="secondary-value">--</strong><p id="last-age" class="muted">--</p></article>
      <article class="card"><p class="label">보고 주기</p><strong id="report-interval" class="secondary-value">--</strong><p class="muted">설정값 기준</p></article>
    </section>
    <section class="card chart-card">
      <div class="section-heading"><div><p class="label">최근 추이</p><h2>최근 60회 측정</h2></div><button id="refresh-button" type="button">새로고침</button></div>
      <div class="chart-wrap"><svg id="flow-chart" viewBox="0 0 900 300" role="img" aria-label="최근 유량 그래프"></svg></div>
    </section>
    <section class="card records-card">
      <div class="section-heading"><div><p class="label">측정 기록</p><h2>최근 10회</h2></div></div>
      <div class="table-wrap"><table><thead><tr><th>측정 시각</th><th>유량</th><th>상태</th></tr></thead><tbody id="records-body"><tr><td colspan="3">데이터를 불러오는 중입니다.</td></tr></tbody></table></div>
    </section>
    <p id="error-detail" class="error-detail" hidden></p>
  </main>
  <script src="config.js?v=1"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
